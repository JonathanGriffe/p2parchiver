services:
  ac-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - ac-server-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ac-server-data:
