[workspace]
resolver = "3"
members = [
    "crates/ac-files",
    "crates/ac-peers",
    "crates/ac-groups",
    "crates/ac-net",
    "crates/ac-node",
    "crates/ac-server",
    "crates/ac-desktop",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
ac-net = { path = "crates/ac-net" }
# The application layer. Depends on `ac-net`, never the reverse, which is what lets the
# group protocol live outside the networking crate and keeps `ac-server` free of it.
ac-groups = { path = "crates/ac-groups" }
# Content. Depends on `ac-groups` for the group id it files things under, never the reverse:
# a group is a membership question and stays answerable with nothing stored.
ac-files = { path = "crates/ac-files" }
# The supervisor. Depends on everything below it and nothing depends on it but the binary:
# deciding who to call needs to see membership and content at once.
ac-peers = { path = "crates/ac-peers" }
# The binary with a window. Depends on `ac-node` for both halves of a node: the daemon loop
# it runs on a thread, and the `ops` layer the CLI dispatches through.
ac-node = { path = "crates/ac-node" }

libp2p = { version = "0.56", features = [
    "ed25519", "serde", "macros", "tokio",
    "quic", "tcp", "noise", "yamux", "dns",
    "identify", "ping",
    "request-response", "cbor",
    "relay", "rendezvous", "autonat",
    "upnp",
    "dcutr",
    "mdns",
    "memory-connection-limits",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# Attestations are signed over their CBOR encoding, carried verbatim. libp2p's
# `cbor` codec does not expose an encoder, so this is the one we control.
ciborium = "0.2"
toml = "1"
directories = "6"
# Bundled SQLite so a node never depends on a system library being present or
# recent enough; this ships to desktops we do not control.
rusqlite = { version = "0.40", features = ["bundled"] }
# Invite codes: OS randomness, and a hash so a leaked database backup does
# not hand over live invites.
getrandom = "0.4"
sha2 = "0.10"
hex = "0.4"

# The desktop UI, compiled from .slint markup into this binary. Chosen over a webview so a
# node ships as one file: the same reason SQLite is bundled above.
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2", "std", "backend-winit", "renderer-software", "accessibility",
] }
slint-build = "1.17"

tracing = "0.1"
# A desktop app has no console to log to, and an unattended one needs its log capped.
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Ping is mounted per connection via `Either`; see `ac_net::keepalive`.
either = "1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The node will run unattended for long stretches; a panic in the event loop
# takes the whole daemon down, so surface the usual suspects at compile time.
unwrap_used = "warn"
expect_used = "warn"
