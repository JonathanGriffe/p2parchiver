name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the CI toolchain is the pinned one by construction
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Formatting does not vary by platform, so checking it once is enough.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      # `--all-targets` covers tests and examples, not just the library and binaries.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  release:
    name: release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # To push the tag. The default token is read-only, and without this `tag.sh` gets as
      # far as deciding a version and then fails on the push.
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Full history and every tag: the version is computed from what has happened since the
      # last one, and a shallow clone would make that the whole history every time.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # After `test`, deliberately. A tag is a claim that this commit is releasable, so
      # nothing should be tagged that has not passed.
      - name: Decide the version and tag it
        id: tag
        run: ./scripts/tag.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ac-server
          # The version this run decided, and two labels that move: `latest` for anyone
          # pulling by hand, and an immutable sha tag for naming an exact commit. The
          # deployment names the version, which never moves once published.
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every push recompiles the whole dependency tree, which for a
          # libp2p build is the dominant cost of this workflow. Nothing above writes the
          # version into the source, precisely so that this stays warm from build to build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: package (${{ matrix.os }})
    needs: [test, release]
    if: always() && needs.test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Stamp the released version
        if: needs.release.outputs.version != ''
        shell: bash
        run: |
          version='${{ needs.release.outputs.version }}'
          sed -i "s/^version = \"0.0.0\"/version = \"$version\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Build
        run: cargo build --release -p ac-desktop -p ac-node

      - name: Package
        working-directory: crates/ac-desktop
        run: cargo packager --release --formats ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: target/packages/*
          if-no-files-found: error

  deploy:
    name: deploy
    needs: release
    runs-on: ubuntu-latest
    steps:
      # A different repository, so `GITHUB_TOKEN` cannot reach it: `DEPLOY_PAT` is a
      # personal access token with write on `beatguessr-infra`.
      - uses: actions/checkout@v4
        with:
          repository: JonathanGriffe/beatguessr-infra
          token: ${{ secrets.DEPLOY_PAT }}

      # Argo CD watches `helm/ac-server/` on that repository's `main` with `selfHeal`, so
      # this commit *is* the deployment. The chart takes its image tag from `appVersion`,
      # which is the same shape `clockdata` uses and the reason there is one line to edit.
      - name: Point the chart at the new image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sed -i "s/^appVersion: .*/appVersion: $VERSION/" helm/ac-server/Chart.yaml

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .

          if git diff --cached --quiet; then
            echo "helm/ac-server already points at $VERSION"
            exit 0
          fi

          git commit -m "chore: update ac-server Docker image to $VERSION"
          git push origin main
