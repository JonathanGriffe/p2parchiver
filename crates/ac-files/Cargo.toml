[package]
name = "ac-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ac-net.workspace = true
ac-groups.workspace = true
libp2p.workspace = true
serde.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Deliberately absent: `tokio` (this crate has no async), and `anyhow` (a library returns
# typed errors; the binaries add context).
#
# `libp2p` is here for `wire.rs` only, which declares the protocols. Everything else in this
# crate stays free of networking types, and `tests/layering.rs` enforces that by reading the
# source. `libp2p-stream` is deliberately *not* here: moving bytes needs an async runtime and
# a spawned task, so it lives in `ac-node` and this crate never sees a stream.

[dev-dependencies]
tempfile = "3"
ciborium.workspace = true

[lints]
workspace = true
