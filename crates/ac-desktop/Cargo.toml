[package]
name = "ac-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ac-desktop"
path = "src/main.rs"

[dependencies]
ac-node.workspace = true
ac-net.workspace = true
slint.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
fontique = { version = "0.10", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
